<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>St. Elias — Announcements</title>
<meta name="description" content="Weekly parish announcements for the coffee hour screen.">

<!-- Written by stamp-version.sh on every release. The screen compares this
     against version.json every few minutes and reloads itself, between
     slides, when the two differ — so a fix pushed on Tuesday reaches the hall
     on Tuesday, rather than whenever the Pi next happens to restart. -->
<meta name="kiosk-version" content="202608262126">

<link rel="stylesheet" href="assets/css/fonts.css?v=202608262126">
<link rel="stylesheet" href="assets/css/kiosk.css?v=202608262126">
<link rel="icon" href="assets/img/logo-se.png">
</head>
<body>

  <div class="frame">

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" role="img" aria-label="St. Elias monogram"></span>
        <div class="brand__text">
          <p class="brand__name" id="church-name">St. Elias Orthodox Church</p>
          <p class="brand__tagline" id="tagline">This Week in Our Parish</p>
        </div>
      </div>

      <div class="clock" id="clock">
        <p class="clock__time" id="clock-time"></p>
        <p class="clock__date" id="clock-date"></p>
        <p class="clock__weather" id="clock-weather" hidden></p>
      </div>
    </header>

    <main class="stage" id="stage" aria-live="polite"></main>

    <!-- Shown only when the Sheet has no announcements to display today. -->
    <section class="empty" id="empty" hidden>
      <img class="empty__mark" src="assets/img/cross-byzantine.png" alt="">
      <h2 class="empty__title">Welcome</h2>
      <p class="empty__text">
        There are no announcements posted at the moment.<br>
        Please enjoy coffee hour.
      </p>
    </section>

    <footer class="bottombar">
      <div class="dots" id="dots"></div>

      <!-- Set from the Sheet's own "Published At" column — the same value the
           editor shows after publishing. Somebody who has just put new
           announcements up can walk into the hall, read this, and see their
           own publish time, which confirms the screen is current without
           having to take anybody's word for it. -->
      <span class="freshness" id="freshness" hidden></span>

      <span class="offline" id="offline" hidden
            title="Cannot reach the announcements sheet — showing the last saved copy">
        <span class="offline__dot"></span>showing last saved copy
      </span>
    </footer>

    <div class="progress"><span class="progress__bar" id="progress"></span></div>
  </div>

  <script src="assets/js/config.js?v=202608262126"></script>
  <script src="assets/js/qrcode.js?v=202608262126"></script>
  <script src="assets/js/csv.js?v=202608262126"></script>
  <script src="assets/js/deck.js?v=202608262126"></script>
  <script src="assets/js/orthodox-calendar.js?v=202608262126"></script>
  <script src="assets/js/signup-data.js?v=202608262126"></script>
  <script src="assets/js/liturgical-data.js?v=202608262126"></script>
  <script src="assets/js/weather.js?v=202608262126"></script>
  <script src="assets/js/slide.js?v=202608262126"></script>
  <script src="assets/js/app.js?v=202608262126"></script>
</body>
</html>
