<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide preview</title>

<!--
  A single slide, drawn exactly the way the television draws it.

  This page is never opened directly. The editor embeds it in an iframe that
  is a fixed 1920x1080 and then scales that iframe down visually. Because the
  kiosk's whole stylesheet is written in vh/vw, that fixed size is what makes
  the preview truthful: the same font sizes, the same QR panel, the same
  shrink-to-fit and the same trimming decisions as the screen in the hall.
-->

<link rel="stylesheet" href="assets/css/fonts.css?v=202608252245">
<link rel="stylesheet" href="assets/css/kiosk.css?v=202608252245">
</head>
<body>

  <div class="frame">

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" role="img" aria-label="St. Elias monogram"></span>
        <div class="brand__text">
          <p class="brand__name" id="church-name">St. Elias Orthodox Church</p>
          <p class="brand__tagline" id="tagline">This Week in Our Parish</p>
        </div>
      </div>

      <div class="clock" id="clock">
        <p class="clock__time" id="clock-time"></p>
        <p class="clock__date" id="clock-date"></p>
      </div>
    </header>

    <main class="stage" id="stage" aria-live="polite"></main>

    <section class="empty" id="empty" hidden>
      <img class="empty__mark" src="assets/img/cross-byzantine.png" alt="">
      <h2 class="empty__title">Welcome</h2>
      <p class="empty__text">
        There are no announcements posted at the moment.<br>
        Please enjoy coffee hour.
      </p>
    </section>

    <footer class="bottombar">
      <div class="dots" id="dots"></div>
    </footer>

    <div class="progress"><span class="progress__bar" id="progress"></span></div>
  </div>

  <script src="assets/js/config.js?v=202608252245"></script>
  <script src="assets/js/qrcode.js?v=202608252245"></script>
  <script src="assets/js/slide.js?v=202608252245"></script>
  <script src="assets/js/preview-frame.js?v=202608252245"></script>
</body>
</html>
